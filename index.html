<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continental Divide Trail</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a0e06;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Georgia, serif;
      color: #f0e6cc;
    }

    h1 {
      font-size: 28px;
      letter-spacing: 3px;
      margin-bottom: 12px;
      color: #f0d08a;
      text-transform: uppercase;
    }

    #progress-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4a3520;
      border: 1.5px solid #8a6a40;
      transition: background 0.4s;
    }

    .dot.done { background: #c8922a; }
    .dot.active { background: #f0d08a; border-color: #f0d08a; }

    #game-wrap {
      position: relative;
      width: 682px;
      height: 682px;
      border: 3px solid #6a4a20;
      border-radius: 4px;
      overflow: hidden;
      cursor: none;
    }

    #bg-canvas {
      position: absolute;
      top: 0; left: 0;
    }

    #game-canvas {
      position: absolute;
      top: 0; left: 0;
    }

    #flash-overlay {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s;
    }

    #hud {
      margin-top: 10px;
      font-size: 14px;
      color: #c8a870;
      letter-spacing: 1px;
      height: 20px;
      text-align: center;
    }

    /* ── Journal panel ── */
    #journal-panel {
      display: none;
      flex-direction: row;
      gap: 20px;
      margin-top: 18px;
      width: 682px;
    }

    #photo-frame {
      width: 200px;
      height: 150px;
      flex-shrink: 0;
      border: 3px solid #8a6a40;
      border-radius: 2px;
      background: #2c1a0e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      position: relative;
      overflow: hidden;
    }

    /* ── swap this for <img> when you have real photos ── */
    #photo-placeholder {
      font-size: 64px;
    }

    #journal-book {
      flex: 1;
      background: #f5edda;
      border-radius: 2px;
      border: 2px solid #8a6a40;
      padding: 14px 18px;
      position: relative;
    }

    #journal-book::before {
      content: '';
      position: absolute;
      left: 28px;
      top: 0; bottom: 0;
      width: 1.5px;
      background: #e0c8a0;
    }

    #journal-date {
      font-size: 11px;
      color: #8a6a40;
      margin-bottom: 8px;
      padding-left: 24px;
    }

    #journal-text {
      font-size: 15px;
      color: #2c1a0e;
      line-height: 1.7;
      padding-left: 24px;
      min-height: 80px;
    }

    #cursor-blink {
      display: inline-block;
      width: 2px;
      height: 14px;
      background: #2c1a0e;
      vertical-align: -2px;
      animation: blink 0.7s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    #continue-btn {
      display: none;
      margin-top: 14px;
      padding: 10px 28px;
      background: #2c1a0e;
      color: #f0d08a;
      border: 2px solid #8a6a40;
      font-family: Georgia, serif;
      font-size: 15px;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
    }

    #continue-btn:hover { background: #4a2e10; }

    #end-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
      text-align: center;
    }

    #end-screen h2 { color: #f0d08a; font-size: 22px; letter-spacing: 2px; }
    #end-screen p  { color: #c8a870; font-size: 15px; max-width: 400px; line-height: 1.6; }

    #restart-btn {
      padding: 10px 28px;
      background: #2c1a0e;
      color: #f0d08a;
      border: 2px solid #8a6a40;
      font-family: Georgia, serif;
      font-size: 15px;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
    }

    #restart-btn:hover { background: #4a2e10; }
  </style>
</head>
<body>

  <h1>Continental Divide Trail</h1>

  <div id="progress-bar"></div>

  <div id="game-wrap">
    <!-- Layer 1: your background art -->
    <canvas id="bg-canvas" width="682" height="682"></canvas>
    <!-- Layer 2: game objects (player + checkpoint circle) -->
    <canvas id="game-canvas" width="682" height="682"></canvas>
    <div id="flash-overlay"></div>
  </div>

  <div id="hud">Move toward the circle with the arrow keys</div>

  <!-- Journal appears after each capture -->
  <div id="journal-panel">
    <div id="photo-frame">
      <img src="photos/img1.jpeg" style="width:100%;height:100%;object-fit:cover;">
      <span id="photo-placeholder">📸</span>
    </div>
    <div id="journal-book">
      <div id="journal-date"></div>
      <div id="journal-text">
        <span id="typed-text"></span><span id="cursor-blink"></span>
      </div>
    </div>
  </div>

  <button id="continue-btn" onclick="nextCheckpoint()">Continue →</button>

  <div id="end-screen">
    <h2>Journey complete!</h2>
    <p>The October 2026 Hiking Trip is done! Thanks for recapping the journey</p>
    <button id="restart-btn" onclick="startGame()">Play again</button>
  </div>


  <script>
    // ════════════════════════════════════════════════════

    //  date: shown at the top of the journal entry
    // ════════════════════════════════════════════════════
    const CHECKPOINTS = [
      {
        x: 215, y: 466,
        emoji: '🌾',
        photo: 'photos/img1.jpeg',            
        caption: "We started the hike just about 2:45 pm. The pace was pretty mild, especially with a slight incline. There were some learning notes, but for the most part people hiked pretty silently. There were some puddles still on the ground, with dark clouds moving in and thunder sounding off a bit away. Just over 30 minutes following us starting on the path, we made it to the reservoir that gave the trailhead its name. Rocket the cattle dog stepped into it as we talked among ourselves briefly. The aspens across the water were bright yellow, standing out next to the evergreen trees. The amount of water we saw was unlike any I had seen in the state, even after living here several years and visiting previously. We knew the month and a half prior visiting had been far wetter than an average year, and had expected more water than on average. Coming up upon the reservoir was a relief, as we knew that we were roughly halfway to our goal destination. However, it meant that we would soon have to cross what typically is a trickling stream. However, it was certainly too quick, deep, and wide in this state to cross. This created some trouble, but thankfully we were all able to make it across without just walking through. This beginning section of the weekend backpacking trip was pretty quiet, which allowed me time to think on the lessons and topics we had discussed previously in the class. Especially with conditions on the trail being so out of the norm, it was clear certain infrastructure that would work almost any other time was not providing the aid it was intended to do. This brought me back to the article “Thru-hiking the John Muir Trail as a modern pilgrimage: implications for natural resource management”, as they talked in that article about trail maintenance. While some things don’t apply, I am certain that most of the trail - especially away from vehicle accessible roads - is maintained by the hikers passing through and any volunteers. Hitchner et al. states that “natural resource managers, park rangers, employees of national forests, etc…” focus their time and resources towards the topics and issues that hikers present the most regarding certain trails/regions. In a region where heavy standing water is practically unheard of, there is no reason to have infrastructure to aid crossing a wide stream. However, I was surprised that an area with high elevation that could result in heavy snowfall would not have a way to deal with the snowmelt repercussions. If these recent weather patterns begin to become an annual pattern, I think the resources will have to expand to take that into account. Some things cannot be changed, like the ground’s ability to soak in water, but things can be done to make the trail itself not have stillwater and to make traversing running water easier. Hitchner et al. also discusses how the individuals who help maintain the trails have to focus on the desires, needs, and goals of the people who are hiking the trail. When discussing this area, it appeared to me that it was relatively commonly used: the reservoir is a reasonable distance for day trips and picnics, and going further leads to multiple major trails. Additionally, it is significant that a portion of the trails running through the area are on the Continental Divide Trail, which sees many thru-hikers annually. This is a wide spread of uses and intentions regarding the area, which makes it difficult to cater to everyone's needs. Even with the struggles, there were clearly portions of the trail that had conscious effort to improve the experience, and I was grateful for the individuals who worked on it - even if it wasn’t as helpful in our case as it could have been. I reflected on the woods I grew up in, and the individuals I know who work in land management or for park services. I have always loved those individuals, as they simply want nature to be a good experience for those willing to walk through it. .",
        date: '10.23 3:18pm'
      },
      {
        x: 306, y: 287,
        emoji: '🦬',
        photo: 'photos/img2.jpeg',
        caption: "After a bit over an hour and a half, we managed to find the clearing we saw on the map and designated it as our goal site. The original site we looked at was filled with a few tents, so we followed the treeline up to another side of the clearing a couple hundred yards away. I found a ring of logs, clearly placed by previous campers, despite being a couple dozen feet away from the clear campfire. I decided to set up my tent in it. While setting up my tent, I had the ability to observe other people - what they brought, how they were acting following the hike, how prepared for the rain they were. It brought me back to the chapter written by Cummings and Johnston, in “Prehistoric Journeys”. In the chapter titled “Short journeys, long distance thinking”, they conclude the chapter by acknowledging the tensions between individuals designating hikes or journeys as “local” or “distant”. Several people prior to the trip had acknowledged that they have never been backpacking, and a couple people on the trail stated that it was the longest distance they hiked or backpacked in an extremely long time. Internally, I understood the tension between the designations. My first backpacking trip I was 7 years old, and it was a mile through the snow. We did that for several winters, along with a 15 mile round-trip backpacking hike that we did for several summers starting when I was 9. From my perspective, I’m used to an “average” backpacking daily hike to be between 6-9 miles. I knew this was not the case for many people, but I didn’t fully comprehend it until I went on this trip with people who have different experiences than myself. While I considered the hike to be “only” 2 ish miles, the weight and hiking and climbing over trees and leaping over puddles is brand new for people, and 2 miles of it is significant. Cummings and Johnston argue that the individual’s perception of the journey, not simply the distance or duration, creates the significance of the trek. The significance of the journey - for me personally - was taking time to backpack in a way I never had before. I had never backpacked outside of Oregon, and without my family. While the trip itself ended up feeling more like Oregon with the constant drizzle of rain, I still certainly had an experience that was unlike any I had before. The newness is the focus of the journey, not the steps taken or the distance traveled. While the challenge for some may have been the distance or nerves of it being their first time, my challenge lied in the change. After many years of backpacking with the same group, especially the years we went to the same locations, the routine became so normalized that we never discussed the day plans or snack trades, we just handed them over and took off on the direction we knew to go. I am a person who thrives in habit, and any change can be very hard for me, especially to something that was so routine for so long. However, I found this change to be far less intimidating than I expected. Part of this may have been because I was aware of it going into the weekend, but I also think having a different group of people made me not feel like I had to do things the exact way I used to. I think if my family was there and we were doing that trip, I would likely try to adapt our routine, but with the different group it felt normal and natural to talk things over extensively and do things “differently” than I am used to.",
        date: '10.23 4:32 pm'
      },
      {
        x: 285, y: 280,
        emoji: '💧',
        photo: 'photos/img3.jpeg',
        caption: 'We found Chimney Rock rising impossibly from the flat earth — a landmark every traveler speaks of. We rested the animals here and refilled our water.',
        date: '10.23 6:11 pm'
      },
      {
        x: 325, y: 277,
        emoji: '⛰️',
        photo: 'photos/img4.jpeg',
        caption: 'The Black Hills came into view. The trail grows harder here. Two families turned back today. We pressed on.',
        date: '10.23 7:58pm'
      },
      {
        x: 485, y: 181,
        emoji: '🌊',
        photo: 'photos/img5.jpeg',
        caption: 'Crossing the Sweetwater River cost us a wagon wheel and most of a day. The water was cold as ice even in May. We lost two sacks of flour.',
        date: '10.24 12:21 pm'
      },
      {
        x: 587, y: 185,
        emoji: '🌊',
        photo: 'photos/hike.jpeg',
        caption: 'Crossing the Sweetwater River cost us a wagon wheel and most of a day. The water was cold as ice even in May. We lost two sacks of flour.',
        date: '10.24 1:12 pm'
      },
      {
        x: 676, y: 207,
        emoji: '🌊',
        photo: 'photos/cow.jpeg',
        caption: 'Crossing the Sweetwater River cost us a wagon wheel and most of a day. The water was cold as ice even in May. We lost two sacks of flour.',
        date: '10.24 2:28 pm'
      },
      {
        x: 535, y: 169,
        emoji: '🌊',
        photo: 'photos/oregoncore.jpeg',
        caption: 'Crossing the Sweetwater River cost us a wagon wheel and most of a day. The water was cold as ice even in May. We lost two sacks of flour.',
        date: '10.24 3:17 pm'
      },
      {
        x: 360, y: 283,
        emoji: '🏔️',
        photo: 'photos/img6.jpeg',
        caption: 'South Pass. The highest point on the trail — yet it felt like any other meadow, wide and gentle. The wind was fierce and unrelenting.',
        date: '10.24 4:04 pm'
      },
      {
        x: 309, y: 284,
        emoji: '🏡',
        photo: 'photos/img8.jpeg',
        caption: 'Oregon City. We have arrived. The valley is everything they promised — green and wide and full of promise. We will build our home here, on this hill.',
        date: '10.24 5:30 pm'
      },
      {
        x: 222, y: 420,
        emoji: '🌊',
        photo: 'photos/NightRiver.jpeg',
        caption: 'Crossing the Sweetwater River cost us a wagon wheel and most of a day. The water was cold as ice even in May. We lost two sacks of flour.',
        date: '10.24 6:39 pm'
      },
      {
        x: 211, y: 577,
        emoji: '🌊',
        photo: 'photos/cdtsign.jpeg',
        caption: 'Crossing the Sweetwater River cost us a wagon wheel and most of a day. The water was cold as ice even in May. We lost two sacks of flour.',
        date: '10.24 7:45 pm'
      }
    ];

    // ════════════════════════════════════════════════════
    //  GAME ENGINE — you don't need to edit below here
    //  unless you want to change how things work
    // ════════════════════════════════════════════════════
    const playerSprite = new Image();
    playerSprite.src = 'photos/backpack.png';
    const bgCanvas   = document.getElementById('bg-canvas');
    const gameCanvas = document.getElementById('game-canvas');
    const bgCtx      = bgCanvas.getContext('2d');
    const ctx        = gameCanvas.getContext('2d');
    const W = 682, H = 682;

    let player    = { x: 200, y: 670, size: 16 };
    let keys      = {};
    let phase     = 'explore';    // explore | capture | journal
    let current   = 0;            // which checkpoint we're heading to
    let animFrame;
    let typeTimer;

    // ── Progress dots ──
    function buildDots() {
      const bar = document.getElementById('progress-bar');
      bar.innerHTML = '';
      CHECKPOINTS.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'dot';
        d.id = `dot-${i}`;
        bar.appendChild(d);
      });
    }

    function updateDots() {
      CHECKPOINTS.forEach((_, i) => {
        const d = document.getElementById(`dot-${i}`);
        if (i < current)        d.className = 'dot done';
        else if (i === current) d.className = 'dot active';
        else                    d.className = 'dot';
      });
    }

    // ── Background drawing ──
    // This is a placeholder sky + ground.
    // Replace with: bgCtx.drawImage(yourBgImage, 0, 0, W, H);
    const bgImage = new Image();
    bgImage.src = 'photos/background.jpg';

    function drawBackground() {
      bgCtx.clearRect(0, 0, W, H);
      if (bgImage.complete) {
        bgCtx.drawImage(bgImage, 0, 0, W, H);
      }
    }
    

    // ── Main game canvas drawing ──
    function drawGame() {
      ctx.clearRect(0, 0, W, H);

      if (phase === 'explore') {
        const cp = CHECKPOINTS[current];
        // Pulsing target circle
        const scale = 0.88 + 0.12 * Math.sin(Date.now() / 300);
        ctx.beginPath();
        ctx.arc(cp.x, cp.y, 26 * scale, 0, Math.PI * 2);
        ctx.strokeStyle = '#e07020';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([7, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
        // Center dot
        ctx.beginPath();
        ctx.arc(cp.x, cp.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#e07020';
        ctx.fill();

        // Checkpoint number badge
        ctx.font = 'bold 13px Georgia';
        ctx.fillStyle = '#e07020';
        ctx.textAlign = 'center';
        ctx.fillText(`${current + 1}`, cp.x, cp.y - 34);
      }

      // Draw completed checkpoint markers
      for (let i = 0; i < current; i++) {
        const cp = CHECKPOINTS[i];
        ctx.beginPath();
        ctx.arc(cp.x, cp.y, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#c8922a';
        ctx.fill();
        ctx.font = 'bold 10px Georgia';
        ctx.fillStyle = 'white';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${i + 1}`, cp.x, cp.y);
        ctx.textBaseline = 'alphabetic';
      }

      // ── Player icon ──
      if (playerSprite.complete) {
        ctx.drawImage(playerSprite, player.x - 20, player.y - 24, 40, 48);
}
    }

    // ── Movement ──
    function movePlayer() {
      if (phase !== 'explore') return;
      const speed = 3;
      if (keys['ArrowLeft'])  player.x = Math.max(player.size, player.x - speed);
      if (keys['ArrowRight']) player.x = Math.min(W - player.size, player.x + speed);
      if (keys['ArrowUp'])    player.y = Math.max(player.size, player.y - speed);
      if (keys['ArrowDown'])  player.y = Math.min(H - player.size, player.y + speed);

      // Check if player reached the current checkpoint
      const cp = CHECKPOINTS[current];
      const dx = player.x - cp.x;
      const dy = player.y - cp.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 16) {
        phase = 'capture';
        triggerCapture();
      }
    }

    // ── Camera capture ──
    function triggerCapture() {
      document.getElementById('hud').textContent = '';

      // Camera click sound
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const buf = ac.createBuffer(1, ac.sampleRate * 0.15, ac.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * 0.025));
        }
        const src = ac.createBufferSource();
        src.buffer = buf;
        const filter = ac.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 2000;
        src.connect(filter);
        filter.connect(ac.destination);
        src.start();
      } catch(e) {}

      // White flash
      const flash = document.getElementById('flash-overlay');
      flash.style.transition = 'none';
      flash.style.opacity = '1';
      setTimeout(() => {
        flash.style.transition = 'opacity 0.4s';
        flash.style.opacity = '0';
      }, 60);

      // Show journal after flash settles
      setTimeout(() => {
        showJournal(current);
        cancelAnimationFrame(animFrame);
        drawGame();
      }, 500);
    }

    // ── Journal display ──
    function showJournal(index) {
      const cp = CHECKPOINTS[index];
      phase = 'journal';

      // Show the photo frame
      const photoPlaceholder = document.getElementById('photo-placeholder');
      const photoFrame = document.getElementById('photo-frame');

      if (cp.photo) {
        // Real photo — replace the emoji with an img
        photoFrame.innerHTML = `<img src="${cp.photo}" style="width:100%;height:100%;object-fit:cover;">`;
      } else {
        // Placeholder emoji
        photoFrame.innerHTML = `<span id="photo-placeholder" style="font-size:64px">${cp.emoji}</span>`;
      }

      document.getElementById('journal-date').textContent = cp.date;
      document.getElementById('typed-text').textContent = '';
      document.getElementById('cursor-blink').style.display = 'inline-block';
      document.getElementById('journal-panel').style.display = 'flex';
      document.getElementById('continue-btn').style.display = 'none';

      typeCaption(cp.caption, () => {
        document.getElementById('cursor-blink').style.display = 'none';
        document.getElementById('continue-btn').style.display = 'inline-block';
        document.getElementById('continue-btn').textContent =
          index === CHECKPOINTS.length - 1 ? 'Finish journey' : 'Continue →';
      });
    }

    function typeCaption(text, onDone) {
      clearTimeout(typeTimer);
      const el = document.getElementById('typed-text');
      let i = 0;
      function tick() {
        if (i <= text.length) {
          el.textContent = text.slice(0, i);
          i++;
          typeTimer = setTimeout(tick, 28);
        } else {
          onDone && onDone();
        }
      }
      tick();
    }

    // ── After reading journal, move to next checkpoint ──
    function nextCheckpoint() {
      current++;
      document.getElementById('journal-panel').style.display = 'none';
      document.getElementById('continue-btn').style.display = 'none';

      if (current >= CHECKPOINTS.length) {
        // All done!
        document.getElementById('game-wrap').style.display = 'none';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('end-screen').style.display = 'flex';
        return;
      }

      phase = 'explore';
      updateDots();
      document.getElementById('hud').textContent = `Checkpoint ${current + 1} of ${CHECKPOINTS.length} — keep moving!`;
      loop();
    }

    // ── Main loop ──
    function loop() {
      movePlayer();
      drawGame();
      animFrame = requestAnimationFrame(loop);
    }

    // ── Start / restart ──
    function startGame() {
      clearTimeout(typeTimer);
      cancelAnimationFrame(animFrame);

      current = 0;
      phase   = 'explore';
      player  = { x: 160, y: 520, size: 12 };

      document.getElementById('journal-panel').style.display  = 'none';
      document.getElementById('continue-btn').style.display   = 'none';
      document.getElementById('end-screen').style.display     = 'none';
      document.getElementById('game-wrap').style.display      = 'block';
      document.getElementById('hud').style.display            = 'block';
      document.getElementById('hud').textContent = 'Move toward the circle with the arrow keys';

      buildDots();
      updateDots();
      drawBackground();
      loop();
    }

    // ── Keyboard input ──
    document.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
        e.preventDefault();
      }
    });
    document.addEventListener('keyup', e => {
      keys[e.key] = false;
    });

    // ── Kick it off ──
    startGame();
  </script>
</body>
</html>
